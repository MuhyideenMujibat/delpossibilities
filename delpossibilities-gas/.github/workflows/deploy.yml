name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Package and sync changed files to cPanel
        run: |
          tar czf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='public' \
            --exclude='.env' \
            --exclude='phpunit.xml' \
            --exclude='storage/logs' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='storage/framework/cache/data' \
            --exclude='bootstrap/cache/*.php' \
            .

          for attempt in 1 2 3; do
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ConnectionAttempts=2 -P ${{ secrets.SSH_PORT || 22 }} \
              /tmp/deploy.tar.gz ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.APP_PATH }}/deploy.tar.gz \
            && ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ConnectionAttempts=2 -p ${{ secrets.SSH_PORT || 22 }} \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
              "cd ${{ secrets.APP_PATH }} && tar xzf deploy.tar.gz && rm -f deploy.tar.gz" \
            && break

            if [ "$attempt" = "3" ]; then
              exit 1
            fi

            echo "SSH connection failed, retrying in 20 seconds..."
            sleep 20
          done

      - name: Sync public assets to domain root
        run: |
          DOC_ROOT=$(dirname "${{ secrets.APP_PATH }}")
          APP_DIR_NAME=$(basename "${{ secrets.APP_PATH }}")

          (cd public && tar czf /tmp/public-assets.tar.gz \
            --exclude='storage' \
            --exclude='index.php' \
            --exclude='.htaccess' \
            .)

          # index.php normally sits one level below vendor/bootstrap (in public/);
          # here it's deployed as a sibling of the app folder, so point it inside instead.
          sed "s#__DIR__\.'/\.\./#__DIR__.'/${APP_DIR_NAME}/#g" public/index.php > /tmp/index.php

          for attempt in 1 2 3; do
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ConnectionAttempts=2 -P ${{ secrets.SSH_PORT || 22 }} \
              /tmp/public-assets.tar.gz /tmp/index.php \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:$DOC_ROOT/ \
            && ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ConnectionAttempts=2 -p ${{ secrets.SSH_PORT || 22 }} \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
              "cd $DOC_ROOT && tar xzf public-assets.tar.gz && rm -f public-assets.tar.gz && ln -sfn ${APP_DIR_NAME}/storage/app/public storage" \
            && break

            if [ "$attempt" = "3" ]; then
              exit 1
            fi

            echo "SSH connection failed, retrying in 20 seconds..."
            sleep 20
          done

      - name: Run Laravel Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.APP_PATH }}
            # vendor/ is built and shipped by the CI runner (composer.phar kept getting
            # deleted on this host mid-install, most likely by CPGuard's malware scanner
            # flagging the self-extracting phar), so composer never runs on the server.
            # bootstrap/cache/*.php is excluded from sync, so a stale packages.php can
            # reference dev-only providers (e.g. Pail) missing from the --no-dev vendor
            # we just shipped; clear it before Artisan boots and tries to load them.
            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
            php -d memory_limit=512M artisan package:discover --ansi
            php -d memory_limit=512M artisan config:clear
            php -d memory_limit=512M artisan cache:clear
            php -d memory_limit=512M artisan route:clear
            php -d memory_limit=512M artisan config:cache
            php -d memory_limit=512M artisan migrate --force
